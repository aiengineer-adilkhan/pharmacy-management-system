{% extends 'base.html' %}

{% block content %}

<h2>Suppliers</h2>

<a href="/add-supplier/" class="btn">
    Add Supplier
</a>

<br><br>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Company</th>
        <th>Phone</th>
        <th>Actions</th>
    </tr>

    {% for supplier in suppliers %}
    <tr>
        <td>{{ supplier.id }}</td>
        <td>{{ supplier.name }}</td>
        <td>{{ supplier.company }}</td>
        <td>{{ supplier.phone }}</td>
        <td>
            <a href="/edit-supplier/{{ supplier.id }}/">Edit</a> |
            <a href="/delete-supplier/{{ supplier.id }}/">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No suppliers found.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
