{% extends 'base.html' %}

{% block content %}

<h2>Customers</h2>

<a href="/add-customer/" class="btn">
    Add Customer
</a>

<br><br>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Actions</th>
    </tr>

    {% for customer in customers %}
    <tr>
        <td>{{ customer.id }}</td>
        <td>{{ customer.name }}</td>
        <td>{{ customer.phone }}</td>
        <td>{{ customer.address }}</td>
        <td>
            <a href="/edit-customer/{{ customer.id }}/">Edit</a> |
            <a href="/delete-customer/{{ customer.id }}/">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No customers found.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
