{% extends 'base.html' %}

{% block content %}

<h2>Employees</h2>

<a href="/add-employee/" class="btn">
    Add Employee
</a>

<br><br>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Position</th>
        <th>Salary</th>
        <th>Actions</th>
    </tr>

    {% for employee in employees %}
    <tr>
        <td>{{ employee.id }}</td>
        <td>{{ employee.name }}</td>
        <td>{{ employee.position }}</td>
        <td>{{ employee.salary }}</td>
        <td>
            <a href="/edit-employee/{{ employee.id }}/">Edit</a> |
            <a href="/delete-employee/{{ employee.id }}/">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No employees found.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
