{% extends 'base.html' %}

{% block content %}

<h2>Medicines</h2>

<a href="/add-medicine/" class="btn">
    Add Medicine
</a>

<br><br>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>

    {% for medicine in medicines %}
    <tr>
        <td>{{ medicine.id }}</td>
        <td>{{ medicine.name }}</td>
        <td>{{ medicine.price }}</td>
        <td>{{ medicine.quantity }}</td>
        <td>
            <a href="/edit-medicine/{{ medicine.id }}/">Edit</a> |
            <a href="/delete-medicine/{{ medicine.id }}/">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No medicines found.</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
